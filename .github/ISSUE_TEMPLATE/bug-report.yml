name: Bug report
description: Report something that is not working in whatsgoingon.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Do not include webhook URLs, routing keys, or private monitor addresses.
  - type: textarea
    id: behaviour
    attributes:
      label: What happened?
      description: Describe what you saw and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: List the steps. Include the provider or component if relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, device, and deployment method (Node or Docker). Include the commit or version if known.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove credentials and private information before attaching anything.
